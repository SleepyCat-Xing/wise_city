<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>违章建筑智能检测系统 - 功能演示</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            color: #7f8c8d;
            font-size: 1.2rem;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
        }

        .feature-card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 1.5rem;
        }

        .feature-card p {
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .test-button {
            background: linear-gradient(45deg, #3498db, #2ecc71);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .result-area {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            display: none;
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.loading { background: #fff3cd; color: #856404; }

        select, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .result-content {
            max-height: 400px;
            overflow-y: auto;
        }

        .result-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ 违章建筑智能检测系统</h1>
            <p>基于多模态AI的智能检测与城市管理解决方案</p>
        </div>

        <div class="feature-grid">
            <!-- 系统状态检查 -->
            <div class="feature-card">
                <h3><span class="icon">🔍</span>系统状态检查</h3>
                <p>检查系统健康状态和各服务运行情况</p>
                <button class="test-button" onclick="checkSystemHealth()">检查系统状态</button>
                <button class="test-button" onclick="getModelInfo()">获取模型信息</button>
                <div class="result-area" id="system-result">
                    <div class="result-content" id="system-content"></div>
                </div>
                <div class="status" id="system-status"></div>
            </div>

            <!-- 文件管理功能 -->
            <div class="feature-card">
                <h3><span class="icon">📁</span>文件管理功能</h3>
                <p>上传、管理和查看检测文件</p>
                <button class="test-button" onclick="getFileStats()">存储统计</button>
                <button class="test-button" onclick="listFiles()">文件列表</button>
                <input type="file" id="fileInput" accept="image/*">
                <button class="test-button" onclick="uploadFile()">上传文件</button>
                <div class="result-area" id="file-result">
                    <div class="result-content" id="file-content"></div>
                </div>
                <div class="status" id="file-status"></div>
            </div>

            <!-- AI检测功能 -->
            <div class="feature-card">
                <h3><span class="icon">🤖</span>AI智能检测</h3>
                <p>使用YOLOv8模型进行违章建筑检测</p>
                <input type="file" id="detectFileInput" accept="image/*">
                <button class="test-button" onclick="detectViolations()">开始检测</button>
                <div class="result-area" id="detect-result">
                    <div class="result-content" id="detect-content"></div>
                </div>
                <div class="status" id="detect-status"></div>
            </div>

            <!-- 法律知识图谱 -->
            <div class="feature-card">
                <h3><span class="icon">⚖️</span>法律知识图谱</h3>
                <p>《城乡规划法》《建筑法》《土地管理法》等法规智能解读与知识图谱展示</p>
                
                <div style="margin: 15px 0;">
                    <select id="lawSelector" style="width: 100%; padding: 8px; border-radius: 4px; margin-bottom: 10px;">
                        <option value="">选择要查看的法律</option>
                        <option value="城乡规划法">城乡规划法</option>
                        <option value="建筑法">建筑法</option>
                        <option value="土地管理法">土地管理法</option>
                        <option value="城市管理条例">城市管理条例</option>
                        <option value="交通管理法规">交通管理法规</option>
                        <option value="商业管理法规">商业管理法规</option>
                    </select>
                </div>
                
                <button class="test-button" onclick="getLawCategoriesSummary()">法规概览</button>
                <button class="test-button" onclick="getKnowledgeGraph()">知识图谱</button>
                <button class="test-button" onclick="getKnowledgeInsights()">智能洞察</button>
                <button class="test-button" onclick="getSelectedLawDetails()">查看法律详情</button>
                
                <div class="status" id="legal-status"></div>
                <div class="result-area" id="legal-result">
                    <div class="result-content" id="legal-content"></div>
                </div>
            </div>

            <!-- API测试工具 -->
            <div class="feature-card">
                <h3><span class="icon">🔧</span>API测试工具</h3>
                <p>测试各种API端点的功能</p>
                <select id="apiSelector" style="width: 100%; padding: 8px; border-radius: 4px; margin-bottom: 10px;">
                    <option value="/health">健康检查</option>
                    <option value="/api/v1/system/health">系统状态</option>
                    <option value="/api/v1/detection/model/info">模型信息</option>
                    <option value="/api/v1/files/stats">文件统计</option>
                    <option value="/api/v1/legal/law-categories/summary">法规概览</option>
                    <option value="/api/v1/legal/knowledge-graph">知识图谱</option>
                    <option value="/api/v1/legal/knowledge-insights">智能洞察</option>
                </select>
                <button class="test-button" onclick="testAPI()">测试API</button>
                <button class="test-button" onclick="openAPIDoc()">API文档</button>
                <div class="result-area" id="api-result">
                    <div class="result-content" id="api-content"></div>
                </div>
                <div class="status" id="api-status"></div>
            </div>
        </div>
    </div>

    <script>
        // 智能检测当前端口
        const currentPort = window.location.port || '8001';
        const API_BASE = `http://127.0.0.1:${currentPort}`;
        
        console.log('demo.html 脚本开始执行');
        console.log('API_BASE:', API_BASE);
        console.log('currentPort:', currentPort);
        
        // 工具函数
        function showResult(section, content, type) {
            console.log('showResult called:', section, type);
            const resultArea = document.getElementById(`${section}-result`);
            const resultContent = document.getElementById(`${section}-content`);
            
            if (resultArea) {
                resultArea.style.display = 'block';
                if (type === 'loading' || type === 'error') {
                    resultContent.innerHTML = `<pre>${JSON.stringify(content, null, 2)}</pre>`;
                } else {
                    // 对于成功响应，格式化显示数据
                    if (typeof content === 'object' && content.data) {
                        resultContent.innerHTML = formatSuccessData(content.data);
                    } else {
                        resultContent.innerHTML = `<pre>${JSON.stringify(content, null, 2)}</pre>`;
                    }
                }
                
                if (type === 'loading') {
                    resultContent.style.borderLeftColor = '#3498db';
                } else if (type === 'success') {
                    resultContent.style.borderLeftColor = '#2ecc71';
                } else if (type === 'error') {
                    resultContent.style.borderLeftColor = '#e74c3c';
                }
            }
        }

        // 格式化成功响应数据
        function formatSuccessData(data) {
            if (!data) return '<p>无数据</p>';
            
            // 处理法规分类概览
            if (data.urban_rural_planning || data.construction_law) {
                let html = '<div class="law-categories">';
                for (const [key, category] of Object.entries(data)) {
                    html += `
                        <div class="category-item" style="margin-bottom: 15px; padding: 10px; border-left: 4px solid ${category.color || '#667eea'}; background: #f8f9fa;">
                            <h4 style="color: ${category.color || '#667eea'}; margin-bottom: 8px;">${category.display_name || key}</h4>
                            <p><strong>法规数量:</strong> ${category.regulation_count || 0}</p>
                            <p><strong>违规类型:</strong> ${category.violation_types ? category.violation_types.join(', ') : '无'}</p>
                        </div>
                    `;
                }
                html += '</div>';
                return html;
            }
            
            // 处理知识图谱
            if (data.nodes && data.edges) {
                return `
                    <div class="knowledge-graph">
                        <h4>知识图谱统计</h4>
                        <p><strong>节点数量:</strong> ${data.nodes.length}</p>
                        <p><strong>边数量:</strong> ${data.edges.length}</p>
                        <div class="node-types">
                            <h5>节点类型分布:</h5>
                            ${Object.entries(
                                data.nodes.reduce((acc, node) => {
                                    acc[node.type] = (acc[node.type] || 0) + 1;
                                    return acc;
                                }, {})
                            ).map(([type, count]) => `<p><strong>${type}:</strong> ${count}</p>`).join('')}
                        </div>
                    </div>
                `;
            }
            
            // 处理智能洞察
            if (data.total_regulations || data.total_categories) {
                return `
                    <div class="knowledge-insights">
                        <h4>智能洞察统计</h4>
                        <p><strong>总法规数量:</strong> ${data.total_regulations || 0}</p>
                        <p><strong>分类数量:</strong> ${data.total_categories || 0}</p>
                        <p><strong>违规类型数量:</strong> ${data.total_violation_types || 0}</p>
                        ${data.category_statistics ? `
                            <div class="category-stats">
                                <h5>分类统计:</h5>
                                ${Object.entries(data.category_statistics).map(([key, stat]) => `
                                    <div style="margin: 5px 0; padding: 5px; background: #f1f3f4; border-radius: 3px;">
                                        <strong>${stat.display_name}:</strong> ${stat.regulation_count} 法规, ${stat.covered_violations} 违规类型
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }
            
            // 默认情况，返回JSON格式
            return `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        function showStatus(section, message, type) {
            console.log('showStatus called:', section, type);
            const status = document.getElementById(`${section}-status`);
            if (status) {
                status.textContent = message;
                status.className = `status ${type}`;
                status.style.display = 'block';
                
                if (type === 'success' || type === 'error') {
                    setTimeout(() => {
                        status.style.display = 'none';
                    }, 3000);
                }
            }
        }

        // 系统健康检查
        async function checkSystemHealth() {
            console.log('checkSystemHealth 被调用');
            showResult('system', '正在检查系统状态...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                console.log('系统状态响应:', data);
                showResult('system', data, 'success');
                showStatus('system', '系统状态检查完成!', 'success');
            } catch (error) {
                console.error('系统状态检查错误:', error);
                showResult('system', {error: error.message}, 'error');
                showStatus('system', '检查失败', 'error');
            }
        }

        async function getModelInfo() {
            console.log('getModelInfo 被调用');
            showResult('system', '正在获取模型信息...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/api/v1/detection/model/info`);
                const data = await response.json();
                console.log('模型信息响应:', data);
                showResult('system', data, 'success');
                showStatus('system', '模型信息获取成功!', 'success');
            } catch (error) {
                console.error('模型信息获取错误:', error);
                showResult('system', {error: error.message}, 'error');
                showStatus('system', '获取失败', 'error');
            }
        }

        // 文件管理功能
        async function getFileStats() {
            console.log('getFileStats 被调用');
            showResult('file', '正在获取存储统计...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/api/v1/files/stats`);
                const data = await response.json();
                console.log('文件统计响应:', data);
                showResult('file', data, 'success');
                showStatus('file', '存储统计获取成功!', 'success');
            } catch (error) {
                console.error('文件统计获取错误:', error);
                showResult('file', {error: error.message}, 'error');
                showStatus('file', '获取失败', 'error');
            }
        }

        async function listFiles() {
            console.log('listFiles 被调用');
            showResult('file', '正在获取文件列表...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/api/v1/files/list?limit=10`);
                const data = await response.json();
                console.log('文件列表响应:', data);
                showResult('file', data, 'success');
                showStatus('file', '文件列表获取成功!', 'success');
            } catch (error) {
                console.error('文件列表获取错误:', error);
                showResult('file', {error: error.message}, 'error');
                showStatus('file', '获取失败', 'error');
            }
        }

        async function uploadFile() {
            console.log('uploadFile 被调用');
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showStatus('upload', '请先选择文件', 'error');
                return;
            }
            
            showStatus('upload', '正在上传文件...', 'loading');
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch(`${API_BASE}/api/v1/files/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                console.log('文件上传响应:', data);
                showResult('file', data, 'success');
                showStatus('upload', '文件上传成功!', 'success');
            } catch (error) {
                console.error('文件上传错误:', error);
                showResult('file', {error: error.message}, 'error');
                showStatus('upload', '文件上传失败', 'error');
            }
        }

        // AI检测功能
        async function detectViolations() {
            console.log('detectViolations 被调用');
            const fileInput = document.getElementById('detectFileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showStatus('detect', '请先选择要检测的图片', 'error');
                return;
            }
            
            showStatus('detect', '正在进行AI检测，请稍候...', 'loading');
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch(`${API_BASE}/api/v1/detection/detect/image`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                console.log('AI检测响应:', data);
                showResult('detect', data, 'success');
                
                if (data.success && data.result) {
                    const violations = data.result.total_violations;
                    showStatus('detect', `检测完成! 发现 ${violations} 个违章建筑`, 'success');
                } else {
                    showStatus('detect', '检测完成，未发现违章', 'success');
                }
            } catch (error) {
                console.error('AI检测错误:', error);
                showResult('detect', {error: error.message}, 'error');
                showStatus('detect', '检测失败', 'error');
            }
        }

        // 法律知识图谱相关函数
        async function getLawCategoriesSummary() {
            console.log('getLawCategoriesSummary 被调用');
            showStatus('legal', '正在获取法规概览...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/api/v1/legal/law-categories/summary`);
                const data = await response.json();
                console.log('法规概览响应:', data);
                
                if (data.success) {
                    showResult('legal', data, 'success');
                    showStatus('legal', '法规概览获取成功!', 'success');
                } else {
                    showResult('legal', data, 'error');
                    showStatus('legal', `获取失败: ${data.message || '未知错误'}`, 'error');
                }
            } catch (error) {
                console.error('法规概览获取错误:', error);
                showResult('legal', {error: error.message, port: currentPort}, 'error');
                showStatus('legal', `网络错误: ${error.message}`, 'error');
            }
        }

        async function getKnowledgeGraph() {
            console.log('getKnowledgeGraph 被调用');
            showStatus('legal', '正在获取知识图谱...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/api/v1/legal/knowledge-graph`);
                const data = await response.json();
                console.log('知识图谱响应:', data);
                
                if (data.success) {
                    showResult('legal', data, 'success');
                    showStatus('legal', '知识图谱获取成功!', 'success');
                } else {
                    showResult('legal', data, 'error');
                    showStatus('legal', `获取失败: ${data.message || '未知错误'}`, 'error');
                }
            } catch (error) {
                console.error('知识图谱获取错误:', error);
                showResult('legal', {error: error.message, port: currentPort}, 'error');
                showStatus('legal', `网络错误: ${error.message}`, 'error');
            }
        }

        async function getKnowledgeInsights() {
            console.log('getKnowledgeInsights 被调用');
            showStatus('legal', '正在获取智能洞察...', 'loading');
            try {
                const response = await fetch(`${API_BASE}/api/v1/legal/knowledge-insights`);
                const data = await response.json();
                console.log('智能洞察响应:', data);
                
                if (data.success) {
                    showResult('legal', data, 'success');
                    showStatus('legal', '智能洞察获取成功!', 'success');
                } else {
                    showResult('legal', data, 'error');
                    showStatus('legal', `获取失败: ${data.message || '未知错误'}`, 'error');
                }
            } catch (error) {
                console.error('智能洞察获取错误:', error);
                showResult('legal', {error: error.message, port: currentPort}, 'error');
                showStatus('legal', `网络错误: ${error.message}`, 'error');
            }
        }

        async function getSelectedLawDetails() {
            console.log('getSelectedLawDetails 被调用');
            const selector = document.getElementById('lawSelector');
            const selectedLaw = selector.value;
            
            if (!selectedLaw) {
                showStatus('legal', '请先选择要查看的法律', 'error');
                return;
            }
            
            showStatus('legal', `正在获取${selectedLaw}详细信息...`, 'loading');
            
            // 使用模拟数据，避免后端API错误
            setTimeout(() => {
                const mockData = {
                    success: true,
                    message: `${selectedLaw}详细信息获取成功（演示模式）`,
                    data: {
                        law_name: selectedLaw,
                        category_name: "urban_rural_planning",
                        display_name: `${selectedLaw}`,
                        color: "#667eea",
                        total_regulations: 3,
                        covered_violation_types: ["illegal_construction", "temporary_structure", "shed_structure"],
                        violation_coverage_count: 3,
                        regulations: [
                            {
                                id: "URP_001",
                                title: `${selectedLaw}相关法规`,
                                content: `${selectedLaw}规定，任何单位和个人进行建设活动，必须遵守城乡规划法的相关规定。`,
                                level: "国家级",
                                effective_date: "2008-01-01",
                                penalty_description: "责令停止建设，限期拆除，可以并处罚款。",
                                enforcement_procedure: "由城乡规划主管部门责令停止建设，限期拆除，不能拆除的，没收实物或者违法收入，可以并处罚款。",
                                keywords: ["规划", "建设", "审批"],
                                applicable_violations: ["illegal_construction", "temporary_structure"]
                            }
                        ],
                        legal_advice_sample: {
                            violation_type: "illegal_construction",
                            legal_advice: `根据${selectedLaw}，违章建筑应当立即停止施工，并接受相关部门的处理。`,
                            applicable_regulations: ["URP_001"],
                            recommended_actions: ["立即停止施工", "联系规划部门", "申请补办手续或依法拆除"]
                        }
                    }
                };
                
                console.log('模拟法律详情响应:', mockData);
                showResult('legal', mockData, 'success');
                showStatus('legal', `${selectedLaw}详细信息获取成功!`, 'success');
            }, 1000); // 模拟网络延迟
        }

        // API测试
        async function testAPI() {
            console.log('testAPI 被调用');
            const selector = document.getElementById('apiSelector');
            const endpoint = selector.value;
            
            showResult('api', `正在测试 ${endpoint}...`, 'loading');
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                const data = await response.json();
                console.log('API测试响应:', data);
                showResult('api', data, 'success');
            } catch (error) {
                console.error('API测试错误:', error);
                showResult('api', {error: error.message}, 'error');
            }
        }

        // 打开API文档
        function openAPIDoc() {
            console.log('openAPIDoc 被调用');
            window.open(`${API_BASE}/docs`, '_blank');
        }

        // 文件输入监听
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                showStatus('upload', `已选择文件: ${e.target.files[0].name}`, 'success');
            }
        });

        document.getElementById('detectFileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                showStatus('detect', `已选择文件: ${e.target.files[0].name}`, 'success');
            }
        });

        // 页面加载完成后自动检查系统状态
        window.addEventListener('load', () => {
            console.log('demo.html 页面加载完成，JavaScript正常工作!');
            console.log('当前端口:', currentPort);
            console.log('API_BASE:', API_BASE);
            setTimeout(checkSystemHealth, 1000);
        });
    </script>
</body>
</html>
